<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Carpalx Keyboard Optimizer</title>
		<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — carpalx
		   1200px so a full keyboard fits without scrolling. Key size is derived from
		   the widest staggered row, floored at 30px — below that the two glyphs per
		   key stop being readable and the board scrolls instead.
		   ===================================================================== */
		:root {
			--content-max: 1200px;
			--f-pinky: #ffadad;
			--f-ring: #ffd6a5;
			--f-middle: #fdffb6;
			--f-index: #caffbf;
			--f-thumb: #9bf6ff;
		}
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--f-pinky: #5c3c3c;
				--f-ring: #5c4d3c;
				--f-middle: #5c5c3c;
				--f-index: #3c5c3c;
				--f-thumb: #3c5c5c;
			}
		}
		:root.dark {
			--f-pinky: #5c3c3c;
			--f-ring: #5c4d3c;
			--f-middle: #5c5c3c;
			--f-index: #3c5c3c;
			--f-thumb: #3c5c5c;
		}

		/* This app relies on flexible flex rows (inline flex ratios), so .row
		   stays flex here instead of the core grid. It still wraps on mobile. */
		.row {
			display: flex;
			gap: var(--sp-4);
			margin-bottom: var(--sp-4);
			flex-wrap: wrap;
		}
		.group { flex: 1 1 12rem; min-width: 0; }

		.info { font-size: .875rem; color: var(--text-muted); }
		.error { color: var(--danger); font-size: .875rem; display: block; font-weight: 500; }

		/* Collapsible panels rendered as cards */
		.panel {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			overflow: hidden;
		}
		.panel-header {
			padding: var(--sp-3) var(--sp-4);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: var(--sp-3);
			cursor: pointer;
			background: var(--surface-variant);
			user-select: none;
		}
		.panel-header:hover { background: var(--muted); }
		.panel-header h3 { font-size: 1rem; }
		.panel-content { padding: var(--sp-4); border-top: 1px solid var(--border); }
		.panel-content.collapsed,
		.panel-header.collapsed + .panel-content { display: none; }
		.toggle-icon::after {
			content: '\25BC';
			font-size: .8rem;
			transition: transform .2s;
			display: inline-block;
			color: var(--text-muted);
		}
		.panel-header.collapsed .toggle-icon::after { transform: rotate(-90deg); }

		/* Dense numeric parameter grids keep their own column counts */
		.grid-params {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
			gap: var(--sp-3);
		}
		.grid-params .group label,
		.grid-params label { font-size: .75rem; }
		.grid-params input {
			padding: var(--sp-1) var(--sp-2);
			font-size: .85rem;
			min-height: 34px;
			text-align: right;
		}

		/* Keyboard visualiser */
		.keyboard {
			--key-size: 45px;
			--kg: 4px;
			/* physical row stagger, in key-pitch units, measured from the left edge */
			--stagger-1: 0;
			--stagger-2: 1.33;
			--stagger-3: 1.66;
			--stagger-4: 2;
			display: flex;
			flex-direction: column;
			gap: var(--kg);
			align-items: flex-start;
			overflow-x: auto;
			padding: var(--sp-2);
			user-select: none;
		}
		.kb-row { display: flex; gap: var(--kg); flex-shrink: 0; }
		.key {
			width: var(--key-size);
			height: var(--key-size);
			flex: 0 0 var(--key-size);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: var(--surface);
			color: var(--text);
			cursor: pointer;
			user-select: none;
		}
		.key .uc { font-weight: 700; font-size: calc(var(--key-size) * .3); line-height: 1.1; }
		.key .lc { font-size: calc(var(--key-size) * .23); opacity: .8; line-height: 1.1; }
		.key.relocatable { border-color: var(--primary); }
		.key:not(.relocatable) { border-style: dashed; opacity: .7; }
		.key.highlight { background: var(--highlight-bg); border-color: var(--primary); }
		.key:hover { filter: brightness(.95); }
		.key:active { transform: translateY(1px); }
		.f0, .f9 { background: var(--f-pinky) !important; color: #181c21 !important; }
		.f1, .f8 { background: var(--f-ring) !important; color: #181c21 !important; }
		.f2, .f7 { background: var(--f-middle) !important; color: #181c21 !important; }
		.f3, .f6 { background: var(--f-index) !important; color: #181c21 !important; }
		.f4, .f5 { background: var(--f-thumb) !important; color: #181c21 !important; }
		:root.dark .f0, :root.dark .f1, :root.dark .f2, :root.dark .f3, :root.dark .f4,
		:root.dark .f5, :root.dark .f6, :root.dark .f7, :root.dark .f8, :root.dark .f9 {
			color: var(--text) !important;
		}
		@media (prefers-color-scheme: dark) {
			:root:not(.light) .f0, :root:not(.light) .f1, :root:not(.light) .f2,
			:root:not(.light) .f3, :root:not(.light) .f4, :root:not(.light) .f5,
			:root:not(.light) .f6, :root:not(.light) .f7, :root:not(.light) .f8,
			:root:not(.light) .f9 { color: var(--text) !important; }
		}

		/* Stat tiles */
		.stats {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
			gap: var(--sp-4);
		}
		.stat-card {
			border: 1px solid var(--border);
			padding: var(--sp-4);
			border-radius: var(--radius);
			background: var(--surface-variant);
			min-width: 0;
		}
		.stat-label { font-size: .8125rem; font-weight: 600; color: var(--text-muted); margin-bottom: var(--sp-1); }
		.stat-val { font-size: 1.25rem; font-weight: 700; color: var(--primary); font-family: var(--font-mono); }

		#uploadArea {
			border: 2px dashed var(--border);
			padding: var(--sp-6);
			text-align: center;
			border-radius: var(--radius-lg);
			background: var(--surface-variant);
			cursor: pointer;
			transition: border-color .2s;
		}
		#uploadArea:hover { border-color: var(--primary); }

		/* Rules unique to this app that have no equivalent in the core.
		   Anything here that turns out to be reusable belongs in core.css. */
.primary {
				background: var(--primary);
				color: var(--on-primary);
				border: 0;
			}

			.primary:hover:not(:disabled) {
				background: var(--hover);
			}
	</style>
	</head>
	<body>
	<header class="app-header">
		<div class="app-title-group">

				</svg>

	<main class="app-main">
			<div class="panel" id="optimizationPanel">

	<dialog id="settingsDialog" class="sheet" aria-labelledby="prefTitle">

			<div class="sheet-footer">

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);

				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				} else {
					AppSettings.renderSettings();
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

		<script>
			class Carpalx {

					this.Pr = [1.5, 0.5, 0, 1];

						qwertz: [["`~", "1!", "2@", "3#", "4$", "5%", "6^", "7&", "8*", "9(", "0)", "-_", "=+"], ["q", "w", "e", "r", "t", "z", "u", "i", "o", "p", "[{", "]}", "\\|"], ["a", "s", "d", "f", "g", "h", "j", "k", "l", ";:", "'\""], ["y", "x", "c", "v", "b", "n", "m", ",<", ".>", "/?"]],
						azerty: [["`~", "1!", "2@", "3#", "4$", "5%", "6^", "7&", "8*", "9(", "0)", "-_", "=+"], ["a", "z", "e", "r", "t", "y", "u", "i", "o", "p", "[{", "]}", "\\|"], ["q", "s", "d", "f", "g", "h", "j", "k", "l", "m", "'\""], ["w", "x", "c", "v", "b", "n", ",<", ".>", "/?", ";:"]],
						colemak: [["`~", "1!", "2@", "3#", "4$", "5%", "6^", "7&", "8*", "9(", "0)", "-_", "=+"], ["q", "w", "f", "p", "g", "j", "l", "u", "y", ";:", "[{", "]}", "\\|"], ["a", "r", "s", "t", "d", "h", "n", "e", "i", "o", "'\""], ["z", "x", "c", "v", "b", "k", "m", ",<", ".>", "/?"]],
						dvorak: [["`~", "1!", "2@", "3#", "4$", "5%", "6^", "7&", "8*", "9(", "0)", "[{", "]}"], ["'\"", ",<", ".>", "p", "y", "f", "g", "c", "r", "l", "/?", "=+", "\\|"], ["a", "o", "e", "u", "i", "d", "h", "t", "n", "s", "-_"], [";:", "q", "j", "k", "x", "b", "m", "w", "v", "z"]],
						workman: [["`~", "1!", "2@", "3#", "4$", "5%", "6^", "7&", "8*", "9(", "0)", "-_", "=+"], ["q", "d", "r", "w", "b", "j", "f", "u", "p", ";:", "[{", "]}", "\\|"], ["a", "s", "h", "t", "g", "y", "n", "e", "o", "i", "'\""], ["z", "x", "m", "c", "v", "k", "l", ",<", ".>", "/?"]]

					this.map = {};
					this.positions = [];
					let posId = 0;
					for (let r = 0; r < this.initialLayout.length; r++) {
						this.keys[r] = [];
						for (let c = 0; c < this.initialLayout[r].length; c++) {
							let keyStr = this.initialLayout[r][c];
							let lc, uc;

								uc = keyStr.toUpperCase();

								uc = keyStr[2] || lc;
							} else {

								uc = keyStr[1] || lc;
							}

							let hand = finger >= 5 ? 1 : 0;

								id: posId++,
								row: r,
								col: c,
								lc: lc,
								uc: uc,

							this.keys[r][c] = key;
							this.map[lc] = key;
							this.map[uc] = key;

					let r = key.row;
					let hand = key.hand;

					let Ph = hand === 1 ? this.Ph.right : this.Ph.left;
					let Pf = hand === 0 ? this.Pf.left[finger] : this.Pf.right[finger - 5];

					key.effort.v2_be = this.k2 * baseEffort;
					key.effort.v3_be = this.k3 * baseEffort;
					key.effort.v1_pe = this.kp * this.k1 * penaltyEffort;
					key.effort.v2_pe = this.k2 * penaltyEffort;
					key.effort.v3_pe = this.k3 * penaltyEffort;

					if (params.kp !== undefined)

					if (params.ks !== undefined)
						this.ks = params.ks;
					if (params.k1 !== undefined)
						this.k1 = params.k1;
					if (params.k2 !== undefined)
						this.k2 = params.k2;
					if (params.k3 !== undefined)
						this.k3 = params.k3;
					if (params.w0 !== undefined)
						this.w0 = params.w0;
					if (params.wh !== undefined)
						this.wh = params.wh;
					if (params.wr !== undefined)
						this.wr = params.wr;
					if (params.wf !== undefined)
						this.wf = params.wf;
					if (params.fh !== undefined)
						this.fh = params.fh;
					if (params.fr !== undefined)
						this.fr = params.fr;
					if (params.ff !== undefined)
						this.ff = params.ff;

					if (params.Ph)

					if (params.Pf) {

						if (params.Pf.right)

					}

						for (let c = 0; c < this.keys[r].length; c++) {
							this.calculateKeyEffort(this.keys[r][c]);
						}
					}
					this.precalculateTriadEfforts();

				calculateEffort(triads) {
					let totalEffort = 0;
					let totalCount = 0;
					for (let triad in triads) {
						if (triad.length !== 3) continue;
						if (!this.map[triad[0]] || !this.map[triad[1]] || !this.map[triad[2]]) continue;

						totalEffort += effort * triads[triad];
						totalCount += triads[triad];
					}
					return totalCount > 0 ? totalEffort / totalCount : 0;
				}

								this.posTriadEfforts[i * n * n + j * n + k] = this._getTriadEffortFromKeys(this.positions[i], this.positions[j], this.positions[k]);

						}

						  , r3 = k3.row;

						} else if (f3 === f1) {

								row_flag = 2;
							else if (r2 < r3)
								row_flag = 1;
							else
								row_flag = 0;
						}

						triad_effort += this.pathCosts[hand_flag * 64 + row_flag * 8 + finger_flag];
					}

					return triad_effort;
				}

				calculateTriadEffort(triad) {
					const k1 = this.map[triad[0]], k2 = this.map[triad[1]], k3 = this.map[triad[2]];
					const n = this.positions.length;
					return this.posTriadEfforts[k1.id * n * n + k2.id * n + k3.id];
				}

				getCharToTriads(triads) {
					const charToTriads = {};
					for (let triad in triads) {
						for (let char of triad) {
							if (!charToTriads[char]) charToTriads[char] = new Set();
							charToTriads[char].add(triad);
						}
					}
					return charToTriads;
				}

				calculateWeightedDelta(k1, k2, triads, charToTriads) {
					const key1 = this.keys[k1[0]][k1[1]];
					const key2 = this.keys[k2[0]][k2[1]];

					const affectedTriads = new Set();
					if (charToTriads[key1.lc]) for (const t of charToTriads[key1.lc]) affectedTriads.add(t);
					if (charToTriads[key1.uc]) for (const t of charToTriads[key1.uc]) affectedTriads.add(t);
					if (charToTriads[key2.lc]) for (const t of charToTriads[key2.lc]) affectedTriads.add(t);
					if (charToTriads[key2.uc]) for (const t of charToTriads[key2.uc]) affectedTriads.add(t);

					let effortBefore = 0;
					for (const t of affectedTriads) {
						effortBefore += this.calculateTriadEffort(t) * triads[t];
					}

					this.swapKeys(k1, k2);

					let effortAfter = 0;
					for (const t of affectedTriads) {
						effortAfter += this.calculateTriadEffort(t) * triads[t];
					}

					return effortAfter - effortBefore;
				}

				swapKeys(k1_coord, k2_coord) {
					let r1 = k1_coord[0]
					  , c1 = k1_coord[1];
					let r2 = k2_coord[0]
					  , c2 = k2_coord[1];
					let key1 = this.keys[r1][c1];
					let key2 = this.keys[r2][c2];

					let tmpLc = key1.lc
					  , tmpUc = key1.uc;
					key1.lc = key2.lc;
					key1.uc = key2.uc;
					key2.lc = tmpLc;
					key2.uc = tmpUc;

					this.map[key1.lc] = key1;
					this.map[key1.uc] = key1;
					this.map[key2.lc] = key2;
					this.map[key2.uc] = key2;
				}

				getRelocatableKeys() {
					let list = [];
					for (let r = 0; r < this.mask.length; r++) {
						for (let c = 0; c < this.mask[r].length; c++) {
							if (this.mask[r][c])
								list.push([r, c]);
						}
					}
					return list;
				}

				getTriads(text) {
					let triads = {};
					const lines = text.split(/\r?\n/);
					for (let line of lines) {
						line = line.replace(/\s/g, '').toLowerCase().replace(/[\W_0-9]/g, '');
						if (line.length < 3)
							continue;
						for (let i = 0; i < line.length - 2; i++) {
							let triad = line.substring(i, i + 3);
							if (triad[0] === triad[1] && triad[1] === triad[2])
								continue;
							triads[triad] = (triads[triad] || 0) + 1;
						}
					}
					return triads;
				}

				findBestSwap(triads, charToTriads, totalFreq) {
					const relocatable = this.getRelocatableKeys();
					let bestSwap = null;
					let bestDelta = 0;

					if (this.restrictSameRow) {
						const byRow = {};
						for (const k of relocatable) {
							if (!byRow[k[0]]) byRow[k[0]] = [];
							byRow[k[0]].push(k);
						}
						for (const r in byRow) {
							const rowKeys = byRow[r];
							for (let i = 0; i < rowKeys.length; i++) {
								for (let j = i + 1; j < rowKeys.length; j++) {
									const delta = this.calculateWeightedDelta(rowKeys[i], rowKeys[j], triads, charToTriads);
									this.swapKeys(rowKeys[i], rowKeys[j]); // restore state
									if (delta < bestDelta) {
										bestDelta = delta;
										bestSwap = [rowKeys[i], rowKeys[j]];
									}
								}
							}
						}
					} else {
						for (let i = 0; i < relocatable.length; i++) {
							for (let j = i + 1; j < relocatable.length; j++) {
								const k1 = relocatable[i];
								const k2 = relocatable[j];
								const delta = this.calculateWeightedDelta(k1, k2, triads, charToTriads);
								this.swapKeys(k1, k2); // restore state
								if (delta < bestDelta) {
									bestDelta = delta;
									bestSwap = [k1, k2];
								}
							}
						}
					}
					return {
						bestSwap,
						bestDelta: bestDelta / totalFreq
					};
				}

				copy() {
					let newCarpalx = new Carpalx();
					newCarpalx.restrictSameRow = this.restrictSameRow;
					newCarpalx.updateParameters({
						kb: this.kb,
						kp: this.kp,
						ks: this.ks,
						k1: this.k1,
						k2: this.k2,
						k3: this.k3,
						w0: this.w0,
						wh: this.wh,
						wr: this.wr,
						wf: this.wf,
						fh: this.fh,
						fr: this.fr,
						ff: this.ff,
						path_offset: this.path_offset,
						Pr: this.Pr,
						Ph: this.Ph,
						Pf: this.Pf
					});
					for (let r = 0; r < this.keys.length; r++) {
						for (let c = 0; c < this.keys[r].length; c++) {
							let key = this.keys[r][c];
							let newKey = newCarpalx.keys[r][c];
							newKey.lc = key.lc;
							newKey.uc = key.uc;
							newCarpalx.map[key.lc] = newKey;
							newCarpalx.map[key.uc] = newKey;
							newCarpalx.calculateKeyEffort(newKey);
						}
					}
					return newCarpalx;
				}
			}

			class CarpalxApp {
				/* Physical row stagger in key-pitch units (key width + gap),
				   measured from the keyboard's left edge:
				     row 1 (digits) 0   ·  row 2 (QWERTY) 1.33
				     row 3 (home)   1.66 ·  row 4 (ZXCV)   2
				   Keep in sync with --stagger-* in the stylesheet. */
				static STAGGER = [0, 1.33, 1.66, 2];

				constructor() {
					this.carpalx = new Carpalx();
					this.optimizing = false;
					this.iteration = 0;
					this.bestEffort = Infinity;
					this.corpusText = '';
					this.triads = null;
					this.charToTriads = null;
					this.totalFreq = 0;

					this.setup();
					this.loadState();
					requestAnimationFrame(()=>{
						this.renderKeyboard();
						this.updateEffort();
					}
					);
				}

				saveState() {
					const state = {
						language: this.language,
						themeName: elements.theme.value,
						baseLayout: elements.baseLayoutSelect.value,
						optMode: elements.optModeSelect.value,
						restrictSameRow: elements.restrictSameRow.checked,
						maxIterations: elements.maxIterations.value,
						maxSwaps: elements.maxSwaps.value,
						mask: this.carpalx.mask,
						penalties: {}
					};
					const penaltyInputs = ['kb', 'kp', 'ks', 'k1', 'k2', 'k3', 'w0', 'wh', 'wr', 'wf', 'fh', 'fr', 'ff', 'path_offset', 'Pr_0', 'Pr_1', 'Pr_2', 'Pr_3', 'Ph_L', 'Ph_R', 'Pf_L0', 'Pf_L1', 'Pf_L2', 'Pf_L3', 'Pf_L4', 'Pf_R0', 'Pf_R1', 'Pf_R2', 'Pf_R3', 'Pf_R4'];
					penaltyInputs.forEach(id=>{
						state.penalties[id] = elements[id].value;
					}
					);
					localStorage.setItem('carpalx_state', JSON.stringify(state));
				}

				updateCorpusCache(forceTriads = false) {
					if (!this.corpusText) {
						this.triads = null;
						this.charToTriads = null;
						this.totalFreq = 0;
						return;
					}

					if (forceTriads || !this.triads) {
						this.triads = this.carpalx.getTriads(this.corpusText);
						this.charToTriads = this.carpalx.getCharToTriads(this.triads);
					}

					this.totalFreq = 0;
					for (let t in this.triads) {
						if (t.length === 3 && this.carpalx.map[t[0]] && this.carpalx.map[t[1]] && this.carpalx.map[t[2]]) {
							this.totalFreq += this.triads[t];
						}
					}
				}

				loadState() {
					const saved = localStorage.getItem('carpalx_state');
					if (saved) {
						try {
							const state = JSON.parse(saved);
							this.language = state.language || AppSettings.detectLang(Object.keys(textTranslations));
							this.lang(this.language);
							this.theme(state.themeName || 'auto');

							if (state.baseLayout)
								elements.baseLayoutSelect.value = state.baseLayout;
							if (state.optMode)
								elements.optModeSelect.value = state.optMode;
							if (state.restrictSameRow !== undefined)
								elements.restrictSameRow.checked = state.restrictSameRow;
							if (state.maxIterations)
								elements.maxIterations.value = state.maxIterations;
							if (state.maxSwaps)
								elements.maxSwaps.value = state.maxSwaps;

							if (state.penalties) {
								Object.keys(state.penalties).forEach(id=>{
									if (elements[id])
										elements[id].value = state.penalties[id];
								}
								);
							}

							this.carpalx.initKeyboard(elements.baseLayoutSelect.value);
							if (state.mask)
								this.carpalx.mask = state.mask;
							this.carpalx.restrictSameRow = elements.restrictSameRow.checked;
							this.updateModeUI();
							this.syncParameters();
						} catch (e) {
							console.error("Failed to load state", e);
							this.resetToDefaults();
						}
					} else {
						this.resetToDefaults();
					}
				}

				resetToDefaults() {
					this.language = AppSettings.detectLang(Object.keys(textTranslations));
					this.lang(this.language);
					this.theme('auto');
					this.updateModeUI();
					this.syncParameters();
				}

				setup() {
					elements.language.onchange = event=>{
						this.lang(event.target.value);
						this.saveState();
					}
					;
					elements.theme.onchange = event=>{
						this.theme(event.target.value);
						this.saveState();
					}
					;
					elements.optimizeBtn.onclick = ()=>this.toggleOptimize();
					elements.resetBtn.onclick = ()=>this.reset();
					elements.copyBtn.onclick = ()=>this.copyLayout();
					elements.resetParamsBtn.onclick = ()=>this.resetParams();
					elements.optModeSelect.onchange = ()=>{
						this.updateModeUI();
						this.saveState();
					}
					;
					elements.baseLayoutSelect.onchange = ()=>{
						this.changeBaseLayout();
						this.saveState();
					}
					;
					elements.restrictSameRow.onchange = ()=>{
						this.carpalx.restrictSameRow = elements.restrictSameRow.checked;
						this.saveState();
					}
					;
					elements.maxIterations.oninput = ()=>this.saveState();
					elements.maxSwaps.oninput = ()=>this.saveState();
					elements.corpusFile.onchange = e=>this.loadFile(e);
					const triggerUpload = () => elements.corpusFile.click();
					elements.uploadArea.onclick = triggerUpload;
					elements.uploadArea.onkeydown = e => {
						if (e.key === ' ' || e.key === 'Enter') {
							e.preventDefault();
							triggerUpload();
						}
					};
					elements.uploadArea.ondragover = e=>{
						e.preventDefault();
						elements.uploadArea.style.borderColor = 'var(--primary)';
					}
					;
					elements.uploadArea.ondragleave = ()=>{
						elements.uploadArea.style.borderColor = 'var(--border)';
					}
					;
					elements.uploadArea.ondrop = e=>{
						e.preventDefault();
						elements.uploadArea.style.borderColor = 'var(--border)';
						if (e.dataTransfer.files.length) {
							elements.corpusFile.files = e.dataTransfer.files;
							this.loadFile({
								target: elements.corpusFile
							});
						}
					}
					;

					document.querySelectorAll('.panel-header').forEach(header=>{
						const isCollapsed = header.classList.contains('collapsed');
						header.setAttribute('aria-expanded', !isCollapsed);

						const toggle = () => {
							header.classList.toggle('collapsed');
							header.nextElementSibling.classList.toggle('collapsed');
							const collapsed = header.classList.contains('collapsed');
							header.setAttribute('aria-expanded', !collapsed);
						};
						header.onclick = toggle;
						header.onkeydown = e => {
							if (e.key === ' ' || e.key === 'Enter') {
								e.preventDefault();
								toggle();
							}
						};
					}
					);

					const penaltyInputs = ['kb', 'kp', 'ks', 'k1', 'k2', 'k3', 'w0', 'wh', 'wr', 'wf', 'fh', 'fr', 'ff', 'path_offset', 'Pr_0', 'Pr_1', 'Pr_2', 'Pr_3', 'Ph_L', 'Ph_R', 'Pf_L0', 'Pf_L1', 'Pf_L2', 'Pf_L3', 'Pf_L4', 'Pf_R0', 'Pf_R1', 'Pf_R2', 'Pf_R3', 'Pf_R4'];
					penaltyInputs.forEach(id=>{
						elements[id].oninput = ()=>{
							this.syncParameters();
							this.saveState();
						}
						;
					}
					);

					if (window.ResizeObserver) {
						this._resizeObserver = new ResizeObserver(()=>{
							clearTimeout(this._resizeTimer);
							this._resizeTimer = setTimeout(()=>this.renderKeyboard(), 50);
						}
						);
						this._resizeObserver.observe(elements.keyboard.parentElement);
					} else {
						window.addEventListener('resize', ()=>{
							clearTimeout(this._resizeTimer);
							this._resizeTimer = setTimeout(()=>this.renderKeyboard(), 100);
						}
						);
					}
				}

				syncParameters() {
					const params = {
						kb: parseFloat(elements.kb.value),
						kp: parseFloat(elements.kp.value),
						ks: parseFloat(elements.ks.value),
						k1: parseFloat(elements.k1.value),
						k2: parseFloat(elements.k2.value),
						k3: parseFloat(elements.k3.value),
						w0: parseFloat(elements.w0.value),
						wh: parseFloat(elements.wh.value),
						wr: parseFloat(elements.wr.value),
						wf: parseFloat(elements.wf.value),
						fh: parseFloat(elements.fh.value),
						fr: parseFloat(elements.fr.value),
						ff: parseFloat(elements.ff.value),
						path_offset: parseFloat(elements.path_offset.value),
						Pr: [parseFloat(elements.Pr_0.value), parseFloat(elements.Pr_1.value), parseFloat(elements.Pr_2.value), parseFloat(elements.Pr_3.value)],
						Ph: {
							left: parseFloat(elements.Ph_L.value),
							right: parseFloat(elements.Ph_R.value)
						},
						Pf: {
							left: [parseFloat(elements.Pf_L0.value), parseFloat(elements.Pf_L1.value), parseFloat(elements.Pf_L2.value), parseFloat(elements.Pf_L3.value), parseFloat(elements.Pf_L4.value)],
							right: [parseFloat(elements.Pf_R0.value), parseFloat(elements.Pf_R1.value), parseFloat(elements.Pf_R2.value), parseFloat(elements.Pf_R3.value), parseFloat(elements.Pf_R4.value)]
						}
					};
					this.carpalx.updateParameters(params);
					this.updateEffort();
				}

				updateModeUI() {
					const mode = elements.optModeSelect.value;
					if (mode === 'full' || mode === 'lahc') {
						elements.fullParams.classList.remove('hidden');
						elements.partialParams.classList.add('hidden');
						if (mode === 'lahc') {
							elements.historySizeGroup.classList.remove('hidden');
						} else {
							elements.historySizeGroup.classList.add('hidden');
						}
					} else {
						elements.fullParams.classList.add('hidden');
						elements.partialParams.classList.remove('hidden');
					}
				}

				changeBaseLayout() {
					const layout = elements.baseLayoutSelect.value;
					this.carpalx.initKeyboard(layout);
					this.updateCorpusCache();
					this.syncParameters();
					this.renderKeyboard();
					this.updateEffort();
				}

				async loadFile(event) {
					const file = event.target.files[0];
					if (!file)
						return;
					this.currentFileName = file.name;
					this.corpusText = await file.text();
					this.updateCorpusCache(true);
					this.updateFileNameDisplay();
					this.updateEffort();
				}

				string(key) {
					return textTranslations[this.language]?.[key] ?? key;
				}
				format(value, options={}) {
					return value.toLocaleString(this.language === 'id' ? 'id-ID' : 'en-US', options);
				}

				theme(themeName) { AppSettings.applyTheme(themeName); }

				lang(language) {
					this.language = AppSettings.applyLang(language);
					Object.keys(textTranslations.en).forEach(key=>{
						if (elements[key]) {
							elements[key].textContent = this.string(key);
							const titleKey = key + '_title';
							if (textTranslations.en[titleKey]) {
								elements[key].title = this.string(titleKey);
							}
						}
					}
					);
					[...elements.baseLayoutSelect.options].forEach(option=>option.textContent = this.string(option.value));
					[...elements.optModeSelect.options].forEach(option=>option.textContent = this.string(option.value));
					elements.optimizeBtn.textContent = this.string(this.optimizing ? 'optimizing' : 'optimizeBtn');
					elements.copyBtn.textContent = this.copiedRecently ? this.string('copied') : this.string('copyBtn');
					elements.copyBtn.title = this.string('copyBtn_title');
					elements.language.ariaLabel = this.string('language_label');
					elements.theme.ariaLabel = this.string('theme_label');
					this.updateFileNameDisplay();
				}

				updateFileNameDisplay() {
					if (this.corpusText) {
						elements.fileNameDisplay.textContent = this.string('fileLoaded') + (this.currentFileName || '');
					} else {
						elements.fileNameDisplay.textContent = this.string('noFileLoaded');
					}
				}

				_computeKeySize() {
					const kb = elements.keyboard;
					// clientWidth includes padding, so subtract it or the rows always
					// overflow by a few pixels and the scrollbar never goes away.
					const cs = getComputedStyle(kb);
					const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
					const w = (kb.clientWidth ? kb.clientWidth - pad
						: (kb.parentElement ? kb.parentElement.clientWidth - 64 : 0));
					if (w <= 0)
						return {
							keySize: 45,
							gap: 4
						};

					const gap = w < 380 ? 2 : 4;

					// Widest row in key-pitch units: its stagger offset plus its key count.
					// Row 2 usually wins (1.33 + 13) even though row 1 has the same key count.
					const units = (this.carpalx?.keys || []).reduce(
						(max, row, r) => Math.max(max, (CarpalxApp.STAGGER[r] || 0) + row.length), 0) || 14;

					// units * keySize + (units - 1) * gap = w
					// Floor at 30px: below that the two glyphs per key stop being
					// readable, so let .keyboard scroll horizontally instead.
					const keySize = Math.max(30, Math.floor((w - (units - 1) * gap) / units));
					return {
						keySize,
						gap
					};
				}

				renderKeyboard() {
					const kb = elements.keyboard;
					const {keySize, gap} = this._computeKeySize();

					kb.style.setProperty('--key-size', keySize + 'px');
					kb.style.setProperty('--kg', gap + 'px');

					const activeId = document.activeElement ? document.activeElement.id : null;

					kb.innerHTML = '';

					const staggerUnits = CarpalxApp.STAGGER;

					const fingerNames = {
						0: 'Left Pinky', 1: 'Left Ring', 2: 'Left Middle', 3: 'Left Index', 4: 'Left Thumb',
						5: 'Right Thumb', 6: 'Right Index', 7: 'Right Middle', 8: 'Right Ring', 9: 'Right Pinky'
					};

					this.carpalx.keys.forEach((row,r)=>{
						const rowEl = document.createElement('div');
						rowEl.className = 'kb-row';
						if (staggerUnits[r]) {
							rowEl.style.marginLeft = `calc(${staggerUnits[r]} * (var(--key-size) + var(--kg)))`;
						}

						row.forEach((key,c)=>{
							const keyEl = document.createElement('div');
							const isRelocatable = this.carpalx.mask[r][c];
							keyEl.className = `key f${key.finger}${isRelocatable ? ' relocatable' : ''}`;
							keyEl.id = `key-${r}-${c}`;
							keyEl.setAttribute('role', 'button');
							keyEl.setAttribute('tabindex', '0');
							keyEl.setAttribute('aria-pressed', isRelocatable ? 'true' : 'false');

							const fingerName = fingerNames[key.finger] || 'Unknown Finger';
							const stateLabel = isRelocatable ? 'Relocatable' : 'Fixed';
							keyEl.setAttribute('aria-label', `Key ${key.uc} / ${key.lc}, Row ${r + 1}, Column ${c + 1}, Finger: ${fingerName}, Status: ${stateLabel}`);

							const toggleKey = (e) => {
								if (e) {
									e.preventDefault();
									e.stopPropagation();
								}
								this.carpalx.mask[r][c] = this.carpalx.mask[r][c] ? 0 : 1;
								this.renderKeyboard();
								this.saveState();
							};

							keyEl.onclick = toggleKey;
							keyEl.onkeydown = (e) => {
								if (e.key === ' ' || e.key === 'Enter') {
									toggleKey(e);
								}
							};

							keyEl.innerHTML = `<span class="uc">${key.uc}</span>` + `<span class="lc">${key.lc}</span>`;
							rowEl.appendChild(keyEl);
						}
						);

						kb.appendChild(rowEl);
					}
					);

					if (activeId && activeId.startsWith('key-')) {
						const elToFocus = document.getElementById(activeId);
						if (elToFocus) {
							elToFocus.focus();
						}
					}
				}

				updateEffort() {
					if (!this.corpusText || !this.triads) {
						elements.totalEffort.textContent = '0.000000';
						elements.bestEffortDisplay.textContent = '0.000000';
						return 0;
					}
					const effort = this.carpalx.calculateEffort(this.triads);
					elements.totalEffort.textContent = effort.toFixed(6);
					if (!this.optimizing) {
						this.bestEffort = effort;
						elements.bestEffortDisplay.textContent = effort.toFixed(6);
					}
					return effort;
				}

				async toggleOptimize() {
					if (this.optimizing) {
						this.optimizing = false;
						elements.optimizeBtn.textContent = this.string('optimizeBtn');
						return;
					}

					if (!this.corpusText || !this.triads)
						return;

					this.optimizing = true;
					elements.optimizeBtn.textContent = this.string('optimizing');
					elements.iterations.textContent = '0';

					if (elements.optModeSelect.value === 'partial') {
						await this.runPartialOptimization(this.triads);
					} else if (elements.optModeSelect.value === 'lahc') {
						await this.runLahcOptimization(this.triads);
					} else {
						await this.runFullOptimization(this.triads);
					}

					this.optimizing = false;
					elements.optimizeBtn.textContent = this.string('optimizeBtn');
					this.renderKeyboard();
				}

				async runPartialOptimization(triads) {
					const maxSwaps = parseInt(elements.maxSwaps.value) || 10;
					const charToTriads = this.charToTriads;
					const totalFreq = this.totalFreq;
					if (totalFreq === 0) return;

					let currentEffort = this.carpalx.calculateEffort(triads);
					this.bestEffort = currentEffort;
					elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
					let bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
						lc: k.lc,
						uc: k.uc
					})));
					elements.temperature.textContent = 'N/A';

					for (let i = 1; i <= maxSwaps && this.optimizing; i++) {
						const result = this.carpalx.findBestSwap(triads, charToTriads, totalFreq);
						if (result.bestSwap) {
							this.carpalx.swapKeys(result.bestSwap[0], result.bestSwap[1]);
							currentEffort += result.bestDelta;
							if (currentEffort < this.bestEffort) {
								this.bestEffort = currentEffort;
								elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
								bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
									lc: k.lc,
									uc: k.uc
								})));
							}
							elements.iterations.textContent = i;
							elements.totalEffort.textContent = currentEffort.toFixed(6);
							this.renderKeyboard();
							await new Promise(r=>setTimeout(r, 100));
						} else {
							break;
						}
					}

					this.carpalx.keys.forEach((row,r)=>{
						row.forEach((key,c)=>{
							key.lc = bestLayout[r][c].lc;
							key.uc = bestLayout[r][c].uc;
							this.carpalx.map[key.lc] = key;
							this.carpalx.map[key.uc] = key;
							this.carpalx.calculateKeyEffort(key);
						}
						);
					}
					);
					this.renderKeyboard();
					this.updateEffort();
					this.saveState();
				}

				async runFullOptimization(triads) {
					const maxIterations = parseInt(elements.maxIterations.value) || 5000;
					const t0 = 10;
					const k = 10;
					const p0 = 1;
					const relocatable = this.carpalx.getRelocatableKeys();
					if (relocatable.length < 2)
						return;

					const charToTriads = this.charToTriads;
					const totalFreq = this.totalFreq;

					let currentEffort = this.carpalx.calculateEffort(triads);
					let currentWeightedEffort = currentEffort * totalFreq;
					this.bestEffort = currentEffort;
					elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
					let bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
						lc: k.lc,
						uc: k.uc
					})));

					const relocatableByRow = {};
					if (this.carpalx.restrictSameRow) {
						relocatable.forEach(rk => {
							if (!relocatableByRow[rk[0]]) relocatableByRow[rk[0]] = [];
							relocatableByRow[rk[0]].push(rk);
						});
					}

					for (let i = 1; i <= maxIterations && this.optimizing; i++) {
						const k1_idx = Math.floor(Math.random() * relocatable.length);
						const k1 = relocatable[k1_idx];
						let k2;

						if (this.carpalx.restrictSameRow) {
							if (!relocatableByRow[k1[0]]) {
								relocatable.forEach(rk => {
									if (!relocatableByRow[rk[0]]) relocatableByRow[rk[0]] = [];
									if (!relocatableByRow[rk[0]].includes(rk)) relocatableByRow[rk[0]].push(rk);
								});
							}
							const sameRowKeys = relocatableByRow[k1[0]];
							if (sameRowKeys.length < 2) continue;
							k2 = sameRowKeys[Math.floor(Math.random() * sameRowKeys.length)];
							while (k1[0] === k2[0] && k1[1] === k2[1])
								k2 = sameRowKeys[Math.floor(Math.random() * sameRowKeys.length)];
						} else {
							let k2_idx = Math.floor(Math.random() * relocatable.length);
							while (k1_idx === k2_idx)
								k2_idx = Math.floor(Math.random() * relocatable.length);
							k2 = relocatable[k2_idx];
						}

						const weightedDelta = this.carpalx.calculateWeightedDelta(k1, k2, triads, charToTriads);
						const deffort = weightedDelta / totalFreq;
						const t = t0 * Math.exp(-i * k / maxIterations);

						let accept = false;
						if (deffort < 0) {
							accept = true;
						} else {
							const p = p0 * Math.exp(-deffort / t);
							if (Math.random() < p)
								accept = true;
						}

						if (accept) {
							currentWeightedEffort += weightedDelta;
							currentEffort = currentWeightedEffort / totalFreq;
							if (currentEffort < this.bestEffort) {
								this.bestEffort = currentEffort;
								elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
								bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
									lc: k.lc,
									uc: k.uc
								})));
								this.renderKeyboard();
							}
						} else {
							this.carpalx.swapKeys(k1, k2);
						}

						if (i % 20 === 0) {
							elements.iterations.textContent = i;
							elements.temperature.textContent = t.toFixed(6);
							elements.totalEffort.textContent = currentEffort.toFixed(6);
							await new Promise(r=>setTimeout(r, 0));
						}
					}

					this.carpalx.keys.forEach((row,r)=>{
						row.forEach((key,c)=>{
							key.lc = bestLayout[r][c].lc;
							key.uc = bestLayout[r][c].uc;
							this.carpalx.map[key.lc] = key;
							this.carpalx.map[key.uc] = key;
							this.carpalx.calculateKeyEffort(key);
						}
						);
					}
					);
					this.renderKeyboard();
					this.updateEffort();
					this.saveState();
				}

				async runLahcOptimization(triads) {
					const maxIterations = parseInt(elements.maxIterations.value) || 5000;
					const historySize = parseInt(elements.historySize.value) || 500;
					const relocatable = this.carpalx.getRelocatableKeys();
					if (relocatable.length < 2) return;

					const charToTriads = this.charToTriads;
					const totalFreq = this.totalFreq;

					let currentEffort = this.carpalx.calculateEffort(triads);
					let currentWeightedEffort = currentEffort * totalFreq;
					let history = new Array(historySize).fill(currentWeightedEffort);

					this.bestEffort = currentEffort;
					elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
					let bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
						lc: k.lc,
						uc: k.uc
					})));

					elements.temperature.textContent = 'N/A';

					const relocatableByRow = {};
					if (this.carpalx.restrictSameRow) {
						relocatable.forEach(rk => {
							if (!relocatableByRow[rk[0]]) relocatableByRow[rk[0]] = [];
							relocatableByRow[rk[0]].push(rk);
						});
					}

					for (let i = 1; i <= maxIterations && this.optimizing; i++) {
						const k1_idx = Math.floor(Math.random() * relocatable.length);
						const k1 = relocatable[k1_idx];
						let k2;

						if (this.carpalx.restrictSameRow) {
							if (!relocatableByRow[k1[0]]) {
								relocatable.forEach(rk => {
									if (!relocatableByRow[rk[0]]) relocatableByRow[rk[0]] = [];
									if (!relocatableByRow[rk[0]].includes(rk)) relocatableByRow[rk[0]].push(rk);
								});
							}
							const sameRowKeys = relocatableByRow[k1[0]];
							if (sameRowKeys.length < 2) continue;
							k2 = sameRowKeys[Math.floor(Math.random() * sameRowKeys.length)];
							while (k1[0] === k2[0] && k1[1] === k2[1])
								k2 = sameRowKeys[Math.floor(Math.random() * sameRowKeys.length)];
						} else {
							let k2_idx = Math.floor(Math.random() * relocatable.length);
							while (k1_idx === k2_idx) k2_idx = Math.floor(Math.random() * relocatable.length);
							k2 = relocatable[k2_idx];
						}

						const weightedDelta = this.carpalx.calculateWeightedDelta(k1, k2, triads, charToTriads);
						const newWeightedEffort = currentWeightedEffort + weightedDelta;

						const v = i % historySize;
						if (newWeightedEffort <= currentWeightedEffort || newWeightedEffort <= history[v]) {
							currentWeightedEffort = newWeightedEffort;
							currentEffort = currentWeightedEffort / totalFreq;
							if (currentEffort < this.bestEffort) {
								this.bestEffort = currentEffort;
								elements.bestEffortDisplay.textContent = currentEffort.toFixed(6);
								bestLayout = this.carpalx.keys.map(row=>row.map(k=>({
									lc: k.lc,
									uc: k.uc
								})));
								this.renderKeyboard();
							}
						} else {
							this.carpalx.swapKeys(k1, k2);
						}

						history[v] = currentWeightedEffort;

						if (i % 20 === 0) {
							elements.iterations.textContent = i;
							elements.totalEffort.textContent = currentEffort.toFixed(6);
							await new Promise(r=>setTimeout(r, 0));
						}
					}

					this.carpalx.keys.forEach((row,r)=>{
						row.forEach((key,c)=>{
							key.lc = bestLayout[r][c].lc;
							key.uc = bestLayout[r][c].uc;
							this.carpalx.map[key.lc] = key;
							this.carpalx.map[key.uc] = key;
							this.carpalx.calculateKeyEffort(key);
						}
						);
					}
					);
					this.renderKeyboard();
					this.updateEffort();
					this.saveState();
				}

				async copyLayout() {
					try {
						// Format current keyboard keys to Carpalx standard config format:
						// <keyboard>
						// <row 1>
						// keys    = `~ 1! 2@ 3\# 4$ ...
						// fingers =  0  0  1   2 ...
						// </row>
						// ...
						// </keyboard>
						let layoutStr = "<keyboard>\n\n";
						this.carpalx.keys.forEach((row, r_idx) => {
							const keys = [];
							const fingers = [];
							row.forEach(k => {
								let keyStr;
								if (k.lc === k.uc.toLowerCase()) {
									keyStr = k.lc;
								} else {
									keyStr = k.lc + k.uc;
								}
								// Escape # character for carpalx config formatting
								if (keyStr.includes('#')) {
									keyStr = keyStr.replace('#', '\\#');
								}
								keys.push(keyStr);
								fingers.push(k.finger);
							});
							layoutStr += `<row ${r_idx + 1}>\n`;
							layoutStr += `keys    = ${keys.join(' ')}\n`;
							layoutStr += `fingers = ${fingers.join(' ')}\n`;
							layoutStr += `</row>\n\n`;
						});
						layoutStr += "</keyboard>\n";

						await navigator.clipboard.writeText(layoutStr);

						this.copiedRecently = true;
						elements.copyBtn.textContent = this.string('copied');
						elements.copyBtn.classList.remove('secondary');
						elements.copyBtn.classList.add('success');

						setTimeout(() => {
							this.copiedRecently = false;
							elements.copyBtn.textContent = this.string('copyBtn');
							elements.copyBtn.classList.remove('success');
							elements.copyBtn.classList.add('secondary');
						}, 2000);
					} catch (e) {
						console.error("Failed to copy layout", e);
					}
				}

				resetParams() {
					elements.kb.value = 0.3555;
					elements.kp.value = 0.6423;
					elements.ks.value = 0.4268;
					elements.k1.value = 1;
					elements.k2.value = 0.367;
					elements.k3.value = 0.235;
					elements.w0.value = 0;
					elements.wh.value = 1;
					elements.wr.value = 1.3088;
					elements.wf.value = 2.5948;
					elements.fh.value = 1;
					elements.fr.value = 0.3;
					elements.ff.value = 0.3;
					elements.path_offset.value = 0;
					elements.Pr_0.value = 1.5;
					elements.Pr_1.value = 0.5;
					elements.Pr_2.value = 0;
					elements.Pr_3.value = 1;
					elements.Ph_L.value = 0;
					elements.Ph_R.value = 0;
					elements.Pf_L0.value = 1;
					elements.Pf_L1.value = 0.5;
					elements.Pf_L2.value = 0;
					elements.Pf_L3.value = 0;
					elements.Pf_L4.value = 0;
					elements.Pf_R0.value = 0;
					elements.Pf_R1.value = 0;
					elements.Pf_R2.value = 0;
					elements.Pf_R3.value = 0.5;
					elements.Pf_R4.value = 1;
					this.syncParameters();
					this.saveState();
				}

				reset() {
					this.optimizing = false;
					const layout = elements.baseLayoutSelect.value;
					this.carpalx.initKeyboard(layout);
					this.updateCorpusCache();
					this.renderKeyboard();
					this.updateEffort();
					elements.iterations.textContent = '0';
					elements.temperature.textContent = '0.000000';
					this.saveState();
				}
			}
			new CarpalxApp();
		</script>
