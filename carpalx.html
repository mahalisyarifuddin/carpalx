<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Carpalx Keyboard Optimizer</title>
	<style>
		:root {
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--background: #f9f9ff;
			--surface: #ffffff;
			--text: #181c21;
			--border: #c1c6d4;
			--muted: #f2f3fc;
			--success: #0b6b1d;
			--on-success: #ffffff;
			--danger: #ba1a1a;
			--on-danger: #ffffff;
			--highlight-bg: #d4e3ff;
		}
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--background: #101319;
				--surface: #0b0e14;
				--text: #e0e2ea;
				--border: #414752;
				--muted: #181c21;
				--success: #82db7e;
				--on-success: #00390a;
				--danger: #ffb4ab;
				--on-danger: #93000a;
				--highlight-bg: #001c3a;
			}
		}
		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--background: #101319;
			--surface: #0b0e14;
			--text: #e0e2ea;
			--border: #414752;
			--muted: #181c21;
			--success: #82db7e;
			--on-success: #00390a;
			--danger: #ffb4ab;
			--on-danger: #93000a;
			--highlight-bg: #001c3a;
		}
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			outline-offset: 2px;
		}
		*:focus-visible {
			outline: 2px solid var(--primary);
		}
		body {
			background: var(--background);
			color: var(--text);
			font-family: sans-serif;
			display: flex;
			justify-content: center;
			min-height: 100vh;
			padding: 1rem;
		}
		.container {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 8px;
			max-width: 1000px;
			padding: 2rem;
			width: 100%;
			position: relative;
			margin: 2rem 0;
		}
		.hidden {
			display: none !important;
		}
		h1, h2, h3, label {
			margin: .5rem 0;
		}
		label {
			display: block;
			font-weight: 700;
            font-size: 0.9rem;
		}
		input, select, button, textarea {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--text);
			font-size: 1rem;
			padding: .5rem;
			width: 100%;
		}
		textarea {
			resize: vertical;
			min-height: 120px;
		}
		button {
			cursor: pointer;
		}
		button:disabled {
			opacity: .6;
			cursor: not-allowed;
		}
		.primary {
			background: var(--primary);
			color: var(--on-primary);
			border: 0;
		}
		.primary:hover:not(:disabled) {
			background: var(--hover);
		}
		.secondary:hover:not(:disabled) {
			background: var(--muted);
		}
		.danger {
			background: var(--danger);
			color: var(--on-danger);
			border: 0;
		}
		.success {
			background: var(--success);
			color: var(--on-success);
			border: 0;
		}
		.selectors {
			position: absolute;
			right: 2rem;
			top: 1rem;
			display: flex;
			gap: 8px;
		}
		.selectors select {
			width: auto;
			font-size: .9rem;
		}
		.row {
			display: flex;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.group {
			flex: 1;
		}
		table {
			border-collapse: collapse;
			margin-top: 1rem;
			width: 100%;
			font-size: .9rem;
		}
		th, td {
			border: 1px solid var(--border);
			padding: .5rem;
			text-align: left;
		}
		th {
			background: var(--primary);
			color: var(--on-primary);
		}
		.error {
			color: var(--danger);
			font-size: .9rem;
			margin: 1rem 0;
			display: block;
			font-weight: 500;
		}
		.info {
			font-size: .9rem;
			opacity: .8;
			line-height: 1.6;
		}
		@media(max-width: 768px) {
			.selectors {
				position: static;
				justify-content: end;
				margin-bottom: .5rem;
			}
			.row {
				flex-direction: column;
			}
		}

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 1.5rem 0;
            user-select: none;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .kb-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            min-width: 650px;
        }
        .key {
            width: 45px;
            height: 45px;
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--muted);
            font-size: 0.8rem;
            position: relative;
            transition: background 0.2s;
        }
        .key .uc { font-weight: bold; }
        .key .lc { font-size: 0.75rem; color: var(--text); opacity: 0.8; }
        .key.relocatable { border-color: var(--primary); background: var(--surface); }
        .key.highlight { background: var(--highlight-bg); border-color: var(--primary); }

        .stats {
            margin-top: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .stat-card {
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 4px;
            background: var(--surface);
        }
        .stat-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
        .stat-val { font-size: 1.25rem; font-weight: bold; color: var(--primary); font-family: monospace; }

        .panel {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: var(--muted);
        }
        .panel h3 { margin-top: 0; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .grid-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
        }
        .grid-params .group label { font-size: 0.75rem; }
        .grid-params input { padding: 0.25rem; font-size: 0.85rem; }
	</style>
</head>
<body>
	<div class="container">
		<div class="selectors">
			<select id="language"><option value="en">English</option><option value="id">Bahasa Indonesia</option></select>
			<select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
		</div>
		<h1 id="title"></h1>
		<p id="subtitle" class="info"></p>

        <div class="panel">
            <h3 id="optimizationParamsTitle">Optimization Settings</h3>
            <div class="row">
                <div class="group">
                    <label id="optModeLabel" for="optModeSelect">Mode</label>
                    <select id="optModeSelect">
                        <option value="full">Full (Simulated Annealing)</option>
                        <option value="partial">Partial (Iterative Key Swaps)</option>
                    </select>
                </div>
                <div id="fullParams" class="group row" style="gap: 0.5rem; margin-bottom: 0;">
                    <div class="group">
                        <label id="iterationsLimitLabel">Iterations</label>
                        <input type="number" id="maxIterations" value="5000">
                    </div>
                </div>
                <div id="partialParams" class="group row hidden" style="gap: 0.5rem; margin-bottom: 0;">
                    <div class="group">
                        <label id="maxSwapsLabel">Max Swaps</label>
                        <input type="number" id="maxSwaps" value="10">
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 id="penaltyParamsTitle" style="margin: 0; border: 0;">Penalty Parameters</h3>
                <button id="resetParamsBtn" class="secondary" style="width: auto; padding: 0.25rem 0.75rem; font-size: 0.8rem;"></button>
            </div>
            <div class="grid-params">
                <div class="group"><label title="Component weight: base effort">kb</label><input type="number" step="0.001" id="kb" value="0.3555"></div>
                <div class="group"><label title="Component weight: penalty effort">kp</label><input type="number" step="0.001" id="kp" value="0.6423"></div>
                <div class="group"><label title="Component weight: path effort">ks</label><input type="number" step="0.001" id="ks" value="0.4268"></div>
                <div class="group"><label title="Interaction weight: 1st key">k1</label><input type="number" step="0.001" id="k1" value="1"></div>
                <div class="group"><label title="Interaction weight: 2nd key">k2</label><input type="number" step="0.001" id="k2" value="0.367"></div>
                <div class="group"><label title="Interaction weight: 3rd key">k3</label><input type="number" step="0.001" id="k3" value="0.235"></div>
            </div>
            <div class="grid-params" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                <div class="group"><label title="Default penalty">w0</label><input type="number" step="0.1" id="w0" value="0"></div>
                <div class="group"><label title="Hand weight">wh</label><input type="number" step="0.1" id="wh" value="1"></div>
                <div class="group"><label title="Row weight">wr</label><input type="number" step="0.1" id="wr" value="1.3088"></div>
                <div class="group"><label title="Finger weight">wf</label><input type="number" step="0.1" id="wf" value="2.5948"></div>
                <div class="group"><label title="Path weight: hand">fh</label><input type="number" step="0.1" id="fh" value="1"></div>
                <div class="group"><label title="Path weight: row">fr</label><input type="number" step="0.1" id="fr" value="0.3"></div>
                <div class="group"><label title="Path weight: finger">ff</label><input type="number" step="0.1" id="ff" value="0.3"></div>
                <div class="group"><label title="Path offset">poffset</label><input type="number" step="0.1" id="path_offset" value="0"></div>
            </div>
            <div class="row" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
                <div class="group" style="flex: 1;">
                    <label>Row Penalties (0-3)</label>
                    <div class="grid-params" style="grid-template-columns: repeat(4, 1fr);">
                        <input type="number" step="0.1" id="Pr_0" value="1.5">
                        <input type="number" step="0.1" id="Pr_1" value="0.5">
                        <input type="number" step="0.1" id="Pr_2" value="0">
                        <input type="number" step="0.1" id="Pr_3" value="1">
                    </div>
                </div>
                <div class="group" style="flex: 0.5;">
                    <label>Hand Penalties (L, R)</label>
                    <div class="grid-params" style="grid-template-columns: repeat(2, 1fr);">
                        <input type="number" step="0.1" id="Ph_L" value="0">
                        <input type="number" step="0.1" id="Ph_R" value="0">
                    </div>
                </div>
            </div>
            <div class="row" style="margin-top: 0.5rem;">
                <div class="group">
                    <label>Finger Penalties (L-Pinky to R-Pinky)</label>
                    <div class="grid-params" style="grid-template-columns: repeat(10, 1fr);">
                        <input type="number" step="0.1" id="Pf_L0" value="1" title="Left Pinky">
                        <input type="number" step="0.1" id="Pf_L1" value="0.5" title="Left Ring">
                        <input type="number" step="0.1" id="Pf_L2" value="0" title="Left Middle">
                        <input type="number" step="0.1" id="Pf_L3" value="0" title="Left Index">
                        <input type="number" step="0.1" id="Pf_L4" value="0" title="Left Thumb">
                        <input type="number" step="0.1" id="Pf_R0" value="0" title="Right Thumb">
                        <input type="number" step="0.1" id="Pf_R1" value="0" title="Right Index">
                        <input type="number" step="0.1" id="Pf_R2" value="0" title="Right Middle">
                        <input type="number" step="0.1" id="Pf_R3" value="0.5" title="Right Ring">
                        <input type="number" step="0.1" id="Pf_R4" value="1" title="Right Pinky">
                    </div>
                </div>
            </div>
        </div>

        <div class="row" style="margin-top: 1.5rem;">
            <div class="group">
                <label id="corpusLabel" for="corpusInput"></label>
                <textarea id="corpusInput" placeholder="Enter text to analyze and optimize for..."></textarea>
                <div style="margin-top: 0.5rem;">
                    <input type="file" id="corpusFile" accept=".txt" style="width: auto; font-size: 0.8rem;">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="group">
                <button id="optimizeBtn" class="primary"></button>
            </div>
            <div class="group">
                <button id="resetBtn" class="secondary"></button>
            </div>
        </div>

        <div id="keyboard" class="keyboard"></div>

        <div class="stats">
            <div class="stat-card">
                <div id="effortLabel" class="stat-label"></div>
                <div id="totalEffort" class="stat-val">0.000000</div>
            </div>
            <div class="stat-card">
                <div id="iterationsLabel" class="stat-label"></div>
                <div id="iterations" class="stat-val">0</div>
            </div>
            <div class="stat-card">
                <div id="tempLabel" class="stat-label"></div>
                <div id="temperature" class="stat-val">0.000000</div>
            </div>
        </div>

	</div>
    <script src="carpalx_core.js"></script>
	<script>
		const textTranslations = {
			en: {
				title: 'Carpalx Keyboard Optimizer',
				subtitle: 'Optimize your keyboard layout using simulated annealing based on typing effort models.',
				autoTheme: 'Auto Theme',
				lightTheme: 'Light',
				darkTheme: 'Dark',
                corpusLabel: 'Training Corpus',
                optimizeBtn: 'Start Optimization',
                resetBtn: 'Reset to QWERTY',
                effortLabel: 'Typing Effort',
                iterationsLabel: 'Iterations / Swaps',
                tempLabel: 'Temperature',
                optimizing: 'Stop Optimization',
                placeholder: 'Enter text to analyze and optimize for...',
                optimizationParamsTitle: 'Optimization Settings',
                penaltyParamsTitle: 'Penalty Parameters',
                maxSwapsLabel: 'Max Swaps',
                iterationsLimitLabel: 'Iterations',
                optModeLabel: 'Mode',
                resetParamsBtn: 'Reset Params'
			},
			id: {
				title: 'Optimasi Keyboard Carpalx',
				subtitle: 'Optimalkan tata letak keyboard Anda menggunakan simulated annealing berdasarkan model upaya pengetikan.',
				autoTheme: 'Tema Otomatis',
				lightTheme: 'Terang',
				darkTheme: 'Gelap',
                corpusLabel: 'Korpus Pelatihan',
                optimizeBtn: 'Mulai Optimasi',
                resetBtn: 'Reset ke QWERTY',
                effortLabel: 'Upaya Pengetikan',
                iterationsLabel: 'Iterasi / Pertukaran',
                tempLabel: 'Suhu',
                optimizing: 'Hentikan Optimasi',
                placeholder: 'Masukkan teks untuk dianalisis dan dioptimalkan...',
                optimizationParamsTitle: 'Pengaturan Optimasi',
                penaltyParamsTitle: 'Parameter Penalti',
                maxSwapsLabel: 'Maks Pertukaran',
                iterationsLimitLabel: 'Iterasi',
                optModeLabel: 'Mode',
                resetParamsBtn: 'Reset Parameter'
			}
		};
		const elements = new Proxy({}, { get: (_, id) => document.getElementById(id) });

		class CarpalxOptimizer {
			constructor() {
                this.carpalx = new Carpalx();
                this.optimizing = false;
                this.iteration = 0;
                this.bestEffort = Infinity;

				this.setup();
				this.theme('auto');
				this.language = navigator.language?.startsWith('id') ? 'id' : 'en';
				this.lang(this.language);
                this.renderKeyboard();
			}

			setup() {
				elements.language.onchange = event => this.lang(event.target.value);
				elements.theme.onchange = event => this.theme(event.target.value);
                elements.optimizeBtn.onclick = () => this.toggleOptimize();
                elements.resetBtn.onclick = () => this.reset();
                elements.resetParamsBtn.onclick = () => this.resetParams();
                elements.corpusInput.oninput = () => this.updateEffort();
                elements.optModeSelect.onchange = () => this.updateModeUI();
                elements.corpusFile.onchange = e => this.loadFile(e);

                const penaltyInputs = ['kb', 'kp', 'ks', 'k1', 'k2', 'k3',
                                     'w0', 'wh', 'wr', 'wf', 'fh', 'fr', 'ff', 'path_offset',
                                     'Pr_0', 'Pr_1', 'Pr_2', 'Pr_3', 'Ph_L', 'Ph_R',
                                     'Pf_L0', 'Pf_L1', 'Pf_L2', 'Pf_L3', 'Pf_L4', 'Pf_R0', 'Pf_R1', 'Pf_R2', 'Pf_R3', 'Pf_R4'];
                penaltyInputs.forEach(id => {
                    elements[id].oninput = () => this.syncParameters();
                });
			}

            syncParameters() {
                const params = {
                    kb: parseFloat(elements.kb.value),
                    kp: parseFloat(elements.kp.value),
                    ks: parseFloat(elements.ks.value),
                    k1: parseFloat(elements.k1.value),
                    k2: parseFloat(elements.k2.value),
                    k3: parseFloat(elements.k3.value),
                    w0: parseFloat(elements.w0.value),
                    wh: parseFloat(elements.wh.value),
                    wr: parseFloat(elements.wr.value),
                    wf: parseFloat(elements.wf.value),
                    fh: parseFloat(elements.fh.value),
                    fr: parseFloat(elements.fr.value),
                    ff: parseFloat(elements.ff.value),
                    path_offset: parseFloat(elements.path_offset.value),
                    Pr: [
                        parseFloat(elements.Pr_0.value),
                        parseFloat(elements.Pr_1.value),
                        parseFloat(elements.Pr_2.value),
                        parseFloat(elements.Pr_3.value)
                    ],
                    Ph: {
                        left: parseFloat(elements.Ph_L.value),
                        right: parseFloat(elements.Ph_R.value)
                    },
                    Pf: {
                        left: [
                            parseFloat(elements.Pf_L0.value),
                            parseFloat(elements.Pf_L1.value),
                            parseFloat(elements.Pf_L2.value),
                            parseFloat(elements.Pf_L3.value),
                            parseFloat(elements.Pf_L4.value)
                        ],
                        right: [
                            parseFloat(elements.Pf_R0.value),
                            parseFloat(elements.Pf_R1.value),
                            parseFloat(elements.Pf_R2.value),
                            parseFloat(elements.Pf_R3.value),
                            parseFloat(elements.Pf_R4.value)
                        ]
                    }
                };
                this.carpalx.updateParameters(params);
                this.updateEffort();
            }

            updateModeUI() {
                if (elements.optModeSelect.value === 'full') {
                    elements.fullParams.classList.remove('hidden');
                    elements.partialParams.classList.add('hidden');
                } else {
                    elements.fullParams.classList.add('hidden');
                    elements.partialParams.classList.remove('hidden');
                }
            }

            async loadFile(event) {
                const file = event.target.files[0];
                if (!file) return;
                const text = await file.text();
                elements.corpusInput.value = text;
                this.updateEffort();
            }

			string(key) { return textTranslations[this.language]?.[key] ?? key; }
			format(value, options = {}) { return value.toLocaleString(this.language === 'id' ? 'id-ID' : 'en-US', options); }

			theme(themeName) {
				document.documentElement.className = themeName === 'auto' ? '' : themeName;
				elements.theme.value = themeName;
			}

			lang(language) {
				this.language = elements.language.value = document.documentElement.lang = language;
				Object.keys(textTranslations.en).forEach(key => { if (elements[key]) elements[key].textContent = this.string(key); });
                if (elements.corpusInput) elements.corpusInput.placeholder = this.string('placeholder');
				[...elements.theme.options].forEach(option => option.textContent = this.string(option.value + 'Theme'));
                elements.optimizeBtn.textContent = this.string(this.optimizing ? 'optimizing' : 'optimizeBtn');
			}

            renderKeyboard() {
                elements.keyboard.innerHTML = '';
                this.carpalx.keys.forEach((row, r) => {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'kb-row';
                    const offsets = [0, 20, 35, 50];
                    rowEl.style.paddingLeft = offsets[r] + 'px';

                    row.forEach((key, c) => {
                        const keyEl = document.createElement('div');
                        keyEl.className = 'key' + (this.carpalx.mask[r][c] ? ' relocatable' : '');
                        keyEl.innerHTML = `<span class="uc">${key.uc}</span><span class="lc">${key.lc}</span>`;
                        rowEl.appendChild(keyEl);
                    });
                    elements.keyboard.appendChild(rowEl);
                });
            }

            getTriads(text) {
                let line = text.toLowerCase().replace(/[^a-z]/g, '');
                let triads = {};
                for (let i = 0; i < line.length - 2; i++) {
                    let triad = line.substring(i, i + 3);
                    if (triad[0] === triad[1] && triad[1] === triad[2]) continue;
                    triads[triad] = (triads[triad] || 0) + 1;
                }
                return triads;
            }

            updateEffort() {
                const text = elements.corpusInput.value;
                const triads = this.getTriads(text);
                const effort = this.carpalx.calculateEffort(triads);
                elements.totalEffort.textContent = effort.toFixed(6);
                return effort;
            }

            async toggleOptimize() {
                if (this.optimizing) {
                    this.optimizing = false;
                    elements.optimizeBtn.textContent = this.string('optimizeBtn');
                    return;
                }

                const text = elements.corpusInput.value;
                if (!text) return;
                const triads = this.getTriads(text);
                if (Object.keys(triads).length === 0) return;

                this.optimizing = true;
                elements.optimizeBtn.textContent = this.string('optimizing');

                if (elements.optModeSelect.value === 'partial') {
                    await this.runPartialOptimization(triads);
                } else {
                    await this.runFullOptimization(triads);
                }

                this.optimizing = false;
                elements.optimizeBtn.textContent = this.string('optimizeBtn');
                this.renderKeyboard();
            }

            async runPartialOptimization(triads) {
                const maxSwaps = parseInt(elements.maxSwaps.value) || 10;
                let currentEffort = this.carpalx.calculateEffort(triads);
                elements.temperature.textContent = 'N/A';

                for (let i = 1; i <= maxSwaps && this.optimizing; i++) {
                    const result = this.carpalx.findBestSwap(triads);
                    if (result.bestSwap) {
                        this.carpalx.swapKeys(result.bestSwap[0], result.bestSwap[1]);
                        currentEffort = result.bestEffort;
                        elements.iterations.textContent = i;
                        elements.totalEffort.textContent = currentEffort.toFixed(6);
                        this.renderKeyboard();
                        await new Promise(r => setTimeout(r, 100));
                    } else {
                        break;
                    }
                }
            }

            async runFullOptimization(triads) {
                const maxIterations = parseInt(elements.maxIterations.value) || 5000;
                const t0 = 10;
                const k = 10;
                const p0 = 1;
                const relocatable = this.carpalx.getRelocatableKeys();

                let currentEffort = this.carpalx.calculateEffort(triads);
                this.bestEffort = currentEffort;

                for (let i = 1; i <= maxIterations && this.optimizing; i++) {
                    const k1_idx = Math.floor(Math.random() * relocatable.length);
                    let k2_idx = Math.floor(Math.random() * relocatable.length);
                    while (k1_idx === k2_idx) k2_idx = Math.floor(Math.random() * relocatable.length);

                    const k1 = relocatable[k1_idx];
                    const k2 = relocatable[k2_idx];

                    this.carpalx.swapKeys(k1, k2);
                    const newEffort = this.carpalx.calculateEffort(triads);
                    const deffort = newEffort - currentEffort;
                    const t = t0 * Math.exp(-i * k / maxIterations);

                    let accept = false;
                    if (deffort < 0) {
                        accept = true;
                    } else {
                        const p = p0 * Math.exp(-deffort / t);
                        if (Math.random() < p) accept = true;
                    }

                    if (accept) {
                        currentEffort = newEffort;
                        if (currentEffort < this.bestEffort) {
                            this.bestEffort = currentEffort;
                            this.renderKeyboard();
                        }
                    } else {
                        this.carpalx.swapKeys(k1, k2);
                    }

                    if (i % 20 === 0) {
                        elements.iterations.textContent = i;
                        elements.temperature.textContent = t.toFixed(6);
                        elements.totalEffort.textContent = currentEffort.toFixed(6);
                        await new Promise(r => setTimeout(r, 0));
                    }
                }
            }

            resetParams() {
                elements.kb.value = 0.3555;
                elements.kp.value = 0.6423;
                elements.ks.value = 0.4268;
                elements.k1.value = 1;
                elements.k2.value = 0.367;
                elements.k3.value = 0.235;
                elements.w0.value = 0;
                elements.wh.value = 1;
                elements.wr.value = 1.3088;
                elements.wf.value = 2.5948;
                elements.fh.value = 1;
                elements.fr.value = 0.3;
                elements.ff.value = 0.3;
                elements.path_offset.value = 0;
                elements.Pr_0.value = 1.5;
                elements.Pr_1.value = 0.5;
                elements.Pr_2.value = 0;
                elements.Pr_3.value = 1;
                elements.Ph_L.value = 0;
                elements.Ph_R.value = 0;
                elements.Pf_L0.value = 1;
                elements.Pf_L1.value = 0.5;
                elements.Pf_L2.value = 0;
                elements.Pf_L3.value = 0;
                elements.Pf_L4.value = 0;
                elements.Pf_R0.value = 0;
                elements.Pf_R1.value = 0;
                elements.Pf_R2.value = 0.5;
                elements.Pf_R3.value = 1;
                elements.Pf_R4.value = 0;
                this.syncParameters();
            }

            reset() {
                this.optimizing = false;
                this.carpalx = new Carpalx();
                this.resetParams();
                this.renderKeyboard();
                this.updateEffort();
                elements.iterations.textContent = '0';
                elements.temperature.textContent = '0.000000';
            }
		}
		new CarpalxOptimizer();
	</script>
